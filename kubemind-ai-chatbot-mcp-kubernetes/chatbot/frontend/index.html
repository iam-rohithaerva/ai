<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KubeMind</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>KubeMind</h2>
      <p>Kubernetes AI Assistant</p>
    </aside>
    <main class="chat">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="input-row">
        <input id="user-input" type="text" placeholder="Ask about your cluster..." autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="/script.js"></script>
</body>
</html>
